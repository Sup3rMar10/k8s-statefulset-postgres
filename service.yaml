# Headless service gives each pod a stable DNS name: postgres-0.postgres-headless.data.svc
apiVersion: v1
kind: Service
metadata:
  name: postgres-headless
spec:
  clusterIP: None
  selector: {app: postgres}
  ports:
    - {name: pg, port: 5432}
---
# Normal service for clients.
apiVersion: v1
kind: Service
metadata:
  name: postgres
spec:
  selector: {app: postgres}
  ports:
    - {name: pg, port: 5432}
