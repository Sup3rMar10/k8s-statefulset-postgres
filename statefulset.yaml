# Single-instance Postgres on a PersistentVolume. Not high availability: see README.
# The password comes from a Secret named postgres-credentials that you create; it is not in Git.
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: postgres
spec:
  serviceName: postgres-headless
  replicas: 1
  podManagementPolicy: OrderedReady
  updateStrategy:
    type: RollingUpdate
  selector:
    matchLabels: {app: postgres}
  template:
    metadata:
      labels: {app: postgres}
    spec:
      terminationGracePeriodSeconds: 60     # let Postgres shut down cleanly
      securityContext:
        runAsNonRoot: true
        runAsUser: 999
        fsGroup: 999                        # volume is writable by the postgres group
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: postgres
          image: postgres:16.4
          ports:
            - {name: pg, containerPort: 5432}
          env:
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef: {name: postgres-credentials, key: password}
            - name: PGDATA                  # subdirectory: the volume root contains lost+found
              value: /var/lib/postgresql/data/pgdata
          readinessProbe:
            exec: {command: ["pg_isready", "-U", "postgres"]}
            periodSeconds: 10
          livenessProbe:
            exec: {command: ["pg_isready", "-U", "postgres"]}
            initialDelaySeconds: 30
            periodSeconds: 20
          resources:
            requests: {cpu: 250m, memory: 512Mi}
            limits: {memory: 1Gi}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: {drop: ["ALL"]}
          volumeMounts:
            - {name: data, mountPath: /var/lib/postgresql/data}
            - {name: run, mountPath: /var/run/postgresql}
      volumes:
        - name: run
          emptyDir: {}
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests: {storage: 10Gi}
